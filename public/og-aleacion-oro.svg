<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Calculadora de aleación de oro 18K, 14K y 9K — AURUM LAB</title>
<desc id="desc">Herramienta de AURUM LAB para calcular liga de oro en gramos, con lingotes de oro amarillo, blanco y rosa.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102b48"/><stop offset=".55" stop-color="#07182b"/><stop offset="1" stop-color="#182b3d"/></linearGradient>
 <linearGradient id="gold" x2="1" y2="1"><stop stop-color="#fff0a8"/><stop offset=".35" stop-color="#e6b83e"/><stop offset=".72" stop-color="#a66b12"/><stop offset="1" stop-color="#f6d875"/></linearGradient>
 <linearGradient id="white" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".5" stop-color="#aebdca"/><stop offset="1" stop-color="#f7f8fa"/></linearGradient>
 <linearGradient id="rose" x2="1" y2="1"><stop stop-color="#ffd1b4"/><stop offset=".5" stop-color="#c77c58"/><stop offset="1" stop-color="#f3b18b"/></linearGradient>
 <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#d3a63c" stop-opacity=".45"/><stop offset="1" stop-color="#07182b" stop-opacity="0"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur stdDeviation="15"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="1040" cy="110" r="280" fill="#245078" opacity=".22"/>
<path d="M0 520 Q300 470 600 550 T1200 505 V630 H0Z" fill="url(#floor)"/>
<g transform="translate(64 54)">
 <path d="M0 44 28 0 56 44 28 35Z" fill="url(#gold)"/><path d="M28 0 28 35 56 44Z" fill="#a87816"/>
 <text x="78" y="36" fill="#fff" font-family="Arial,sans-serif" font-size="34" letter-spacing="5">AURUM <tspan fill="#e6b83e">LAB</tspan></text>
</g>
<text x="64" y="230" fill="#fff" font-family="Georgia,serif" font-size="64">Calculadora de</text>
<text x="64" y="305" fill="#f1c65d" font-family="Georgia,serif" font-size="68" font-style="italic">aleación de oro</text>
<rect x="66" y="338" width="190" height="5" rx="2" fill="url(#gold)"/>
<text x="66" y="398" fill="#f3f6fa" font-family="Arial,sans-serif" font-size="28">Calcula liga en gramos</text>
<text x="66" y="448" fill="#e8bd51" font-family="Arial,sans-serif" font-size="22" letter-spacing="2">18K  ·  14K  ·  9K</text>
<ellipse cx="875" cy="520" rx="270" ry="30" fill="#000" opacity=".45" filter="url(#shadow)"/>
<g transform="translate(625 310)">
 <path d="M0 75 112 0 285 65 171 151Z" fill="#a87516"/><path d="M0 75 171 151 171 270 0 194Z" fill="#c18a20"/><path d="M171 151 285 65 285 184 171 270Z" fill="url(#gold)"/><path d="M0 75 112 0 285 65 171 151Z" fill="url(#gold)"/><text x="178" y="212" text-anchor="middle" fill="#68430c" font-family="Arial,sans-serif" font-weight="bold" font-size="43">18K</text>
</g>
<g transform="translate(830 230) scale(.78)">
 <path d="M0 75 112 0 285 65 171 151Z" fill="#778895"/><path d="M0 75 171 151 171 270 0 194Z" fill="#aab7c2"/><path d="M171 151 285 65 285 184 171 270Z" fill="url(#white)"/><path d="M0 75 112 0 285 65 171 151Z" fill="url(#white)"/><text x="178" y="212" text-anchor="middle" fill="#475866" font-family="Arial,sans-serif" font-weight="bold" font-size="43">14K</text>
</g>
<g transform="translate(1000 155) scale(.58)">
 <path d="M0 75 112 0 285 65 171 151Z" fill="#a35d3d"/><path d="M0 75 171 151 171 270 0 194Z" fill="#bd7959"/><path d="M171 151 285 65 285 184 171 270Z" fill="url(#rose)"/><path d="M0 75 112 0 285 65 171 151Z" fill="url(#rose)"/><text x="178" y="212" text-anchor="middle" fill="#743e2a" font-family="Arial,sans-serif" font-weight="bold" font-size="43">9K</text>
</g>
<path d="M0 570 Q320 520 620 585 T1200 560" fill="none" stroke="#d9ad43" stroke-width="3" opacity=".8"/>
</svg>