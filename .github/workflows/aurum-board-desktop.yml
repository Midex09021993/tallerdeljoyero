name: Build AURUM BOARD Desktop

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/aurum-board/**"
      - ".github/workflows/aurum-board-desktop.yml"

permissions:
  contents: read

concurrency:
  group: aurum-board-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Generate Windows app icons
        working-directory: desktop/aurum-board/src-tauri
        run: cargo tauri icon ../icon.svg --output icons
      - name: Build NSIS installer
        working-directory: desktop/aurum-board/src-tauri
        run: cargo tauri build
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurum-board-windows-installer
          path: desktop/aurum-board/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
