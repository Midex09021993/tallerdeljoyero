name: AURUM REA Sandbox CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "infra/rea-sandbox/**"
      - ".github/workflows/rea-sandbox.yml"
  pull_request:
    branches: [main]
    paths:
      - "infra/rea-sandbox/**"
      - ".github/workflows/rea-sandbox.yml"

jobs:
  rea-sandbox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test disabled REA sandbox contract
        run: node --test infra/rea-sandbox/server.test.mjs

      - name: Build isolated sandbox image
        run: docker build -t aurum-rea-sandbox:ci infra/rea-sandbox
