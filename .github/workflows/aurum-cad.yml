name: AURUM CAD Plugin

on:
  push:
    paths:
      - "integrations/rhino8-aurum-cad/**"
      - ".github/workflows/aurum-cad.yml"
  pull_request:
    paths:
      - "integrations/rhino8-aurum-cad/**"
      - ".github/workflows/aurum-cad.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build Rhino 8 plugin (net48 + net8.0)
        run: dotnet build integrations/rhino8-aurum-cad/AurumCad.csproj --configuration Release

      - name: Upload Rhino 8 plugin output
        uses: actions/upload-artifact@v4
        with:
          name: aurum-cad-rhino8-net8
          path: integrations/rhino8-aurum-cad/bin/Release/net8.0/
          if-no-files-found: error
