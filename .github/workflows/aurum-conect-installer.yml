name: AURUM CONECT · Complemento Rhino 7

on:
  push:
    branches: [main]
    paths:
      - "integrations/rhino7-aurum-prototype/**"
      - ".github/workflows/aurum-conect-installer.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurum-conect-rhp-main
  cancel-in-progress: false

jobs:
  build-rhp:
    name: Cross-compile, package and publish Rhino 7 plugin
    # .NET Framework 4.8 SDK-style projects can be cross-compiled on Linux
    # using the official reference-assemblies NuGet package. This avoids
    # dependence on the unavailable GitHub Windows runner pool.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate plugin sources
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "integrations/rhino7-aurum-prototype/AurumConect.csproj"
            "integrations/rhino7-aurum-prototype/AurumConectPlugin.cs"
            "integrations/rhino7-aurum-prototype/AurumConectPanel.cs"
            "integrations/rhino7-aurum-prototype/AurumConectCommands.cs"
            "integrations/rhino7-aurum-prototype/AurumConectLocalServer.cs"
            "integrations/rhino7-aurum-prototype/AurumConectRenderWindow.cs"
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "::error::Required plugin source missing: $path"; exit 1; }
          done

      - name: Restore .NET Framework 4.8 reference assemblies and dependencies
        run: dotnet restore integrations/rhino7-aurum-prototype/AurumConect.csproj --source https://api.nuget.org/v3/index.json --verbosity minimal

      - name: Cross-compile Rhino 7 plugin (.NET Framework 4.8, x64)
        run: dotnet build integrations/rhino7-aurum-prototype/AurumConect.csproj --configuration Release --no-restore --verbosity minimal

      - name: Verify compiled Windows x64 plugin
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, struct, sys
          plugin = pathlib.Path("integrations/rhino7-aurum-prototype/bin/Release/net48/AurumConect.rhp")
          if not plugin.is_file():
              sys.exit("AurumConect.rhp was not produced by the .NET build.")
          data = plugin.read_bytes()
          if len(data) < 4096 or data[:2] != b"MZ":
              sys.exit("AurumConect.rhp is too small or does not have a Windows PE signature.")
          pe_offset = struct.unpack_from("<I", data, 0x3C)[0]
          if pe_offset < 0x40 or pe_offset + 6 > len(data):
              sys.exit("AurumConect.rhp has an invalid PE header offset.")
          if data[pe_offset:pe_offset+4] != bytes((0x50, 0x45, 0x00, 0x00)):
              sys.exit("AurumConect.rhp has an invalid PE signature.")
          machine = struct.unpack_from("<H", data, pe_offset+4)[0]
          if machine != 0x8664:
              sys.exit(f"Expected Windows x64 PE (0x8664), got 0x{machine:04X}.")
          print(f"Validated Windows x64 .RHP: {len(data)} bytes")
          PY

      - name: Assemble complete installation ZIP
        shell: bash
        run: |
          set -euo pipefail
          output="integrations/rhino7-aurum-prototype/bin/Release/net48"
          bundle="integrations/rhino7-aurum-prototype/package"
          rm -rf "$bundle"
          mkdir -p "$bundle" public/downloads

          cp "$output/AurumConect.rhp" "$bundle/AurumConect-Rhino7-1.0.0.rhp"
          for name in Microsoft.Web.WebView2.Core.dll Microsoft.Web.WebView2.WinForms.dll; do
            source_file="$(find "$output" -maxdepth 2 -type f -name "$name" -print -quit)"
            if [[ -z "$source_file" ]]; then
              echo "::error::Required WebView2 assembly missing from build output: $name"
              exit 1
            fi
            cp "$source_file" "$bundle/$name"
          done

          loader="$(find "$output" "$HOME/.nuget/packages/microsoft.web.webview2" -type f -name WebView2Loader.dll 2>/dev/null | grep -E '/(win-x64/native|x64)/' | head -n 1 || true)"
          if [[ -z "$loader" ]]; then
            echo "::error::WebView2Loader.dll for Windows x64 was not found; refusing to publish an incomplete installer."
            exit 1
          fi
          cp "$loader" "$bundle/WebView2Loader.dll"

          test -s "$bundle/AurumConect-Rhino7-1.0.0.rhp"
          test -s "$bundle/Microsoft.Web.WebView2.Core.dll"
          test -s "$bundle/Microsoft.Web.WebView2.WinForms.dll"
          test -s "$bundle/WebView2Loader.dll"

          (cd "$bundle" && zip -9 -q "$GITHUB_WORKSPACE/public/downloads/AurumConect-Rhino7-1.0.0.zip" ./*)
          unzip -t public/downloads/AurumConect-Rhino7-1.0.0.zip
          echo "Complete ZIP created:"
          ls -lh public/downloads/AurumConect-Rhino7-1.0.0.zip

      - name: Upload complete installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AurumConect-Rhino7-1.0.0-Installer
          path: public/downloads/AurumConect-Rhino7-1.0.0.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified ZIP to website on main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          git add public/downloads/AurumConect-Rhino7-1.0.0.zip
          if git diff --cached --quiet; then
            echo "The published installer is already up to date."
            exit 0
          fi
          git commit -m "build(aurum-conect): publish complete Rhino 7 installer"
          git push origin HEAD:main
