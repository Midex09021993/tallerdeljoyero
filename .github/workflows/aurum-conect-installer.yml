name: AURUM CONECT · Complemento Rhino 7

on:
  push:
    branches: [main]
    paths:
      - "integrations/rhino7-aurum-prototype/**"
      - ".github/workflows/aurum-conect-installer.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurum-conect-rhp-main
  cancel-in-progress: false

jobs:
  build-rhp:
    name: Compile, package and publish Rhino 7 plugin
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate plugin sources
        shell: pwsh
        run: |
          $required = @(
            "integrations/rhino7-aurum-prototype/AurumConect.csproj",
            "integrations/rhino7-aurum-prototype/AurumConectPlugin.cs",
            "integrations/rhino7-aurum-prototype/AurumConectPanel.cs",
            "integrations/rhino7-aurum-prototype/AurumConectCommands.cs",
            "integrations/rhino7-aurum-prototype/AurumConectLocalServer.cs",
            "integrations/rhino7-aurum-prototype/AurumConectRenderWindow.cs"
          )
          foreach ($path in $required) {
            if (!(Test-Path $path)) { throw "Required plugin source is missing: $path" }
          }

      - name: Restore pinned Rhino 7 dependencies
        run: dotnet restore integrations/rhino7-aurum-prototype/AurumConect.csproj --source https://api.nuget.org/v3/index.json --verbosity minimal

      - name: Compile Rhino 7 plugin (.NET Framework 4.8)
        run: dotnet build integrations/rhino7-aurum-prototype/AurumConect.csproj --configuration Release --no-restore --verbosity minimal

      - name: Verify compiled Rhino plugin
        shell: pwsh
        run: |
          $output = "integrations/rhino7-aurum-prototype/bin/Release/net48"
          $plugin = Join-Path $output "AurumConect.rhp"
          if (!(Test-Path $plugin)) { throw "AurumConect.rhp was not produced by the .NET build." }
          $file = Get-Item $plugin
          if ($file.Length -lt 4096) { throw "AurumConect.rhp is unexpectedly small ($($file.Length) bytes)." }
          $stream = [System.IO.File]::OpenRead($plugin)
          try {
            $reader = [System.IO.BinaryReader]::new($stream)
            if ($reader.ReadUInt16() -ne 0x5A4D) { throw "AurumConect.rhp does not have a valid Windows PE signature." }
            $stream.Position = 0x3C
            $peOffset = $reader.ReadInt32()
            $stream.Position = $peOffset + 4
            $machine = $reader.ReadUInt16()
            if ($machine -ne 0x8664) { throw "AurumConect.rhp is not an x64 Windows assembly (machine: 0x$('{0:X4}' -f $machine))." }
          } finally {
            $stream.Dispose()
          }
          [void][System.Reflection.AssemblyName]::GetAssemblyName((Resolve-Path $plugin))
          Write-Host "Validated x64 .RHP: $($file.Length) bytes"

      - name: Assemble complete installation package
        shell: pwsh
        run: |
          $output = "integrations/rhino7-aurum-prototype/bin/Release/net48"
          $bundle = "integrations/rhino7-aurum-prototype/package"
          if (Test-Path $bundle) { Remove-Item $bundle -Recurse -Force }
          New-Item -ItemType Directory -Path $bundle -Force | Out-Null

          Copy-Item "$output/AurumConect.rhp" "$bundle/AurumConect-Rhino7-1.0.0.rhp" -Force

          $managed = @(Get-ChildItem $output -File -Filter "Microsoft.Web.WebView2*.dll")
          foreach ($name in @("Microsoft.Web.WebView2.Core.dll", "Microsoft.Web.WebView2.WinForms.dll")) {
            if (!($managed.Name -contains $name)) { throw "Required WebView2 assembly missing from build output: $name" }
          }
          foreach ($assembly in $managed) {
            Copy-Item $assembly.FullName $bundle -Force
          }

          $loader = Get-ChildItem $output -Recurse -File -Filter "WebView2Loader.dll" |
            Where-Object { $_.FullName -match "[\\/]win-x64[\\/]native[\\/]" -or $_.FullName -match "[\\/]x64[\\/]" } |
            Select-Object -First 1
          if (!$loader) { throw "WebView2Loader.dll for Windows x64 was not found. Refusing to publish an incomplete installer." }
          Copy-Item $loader.FullName "$bundle/WebView2Loader.dll" -Force

          $requiredFiles = @(
            "AurumConect-Rhino7-1.0.0.rhp",
            "Microsoft.Web.WebView2.Core.dll",
            "Microsoft.Web.WebView2.WinForms.dll",
            "WebView2Loader.dll"
          )
          foreach ($name in $requiredFiles) {
            if (!(Test-Path (Join-Path $bundle $name))) { throw "Installer package is missing $name" }
          }

          New-Item -ItemType Directory -Path "public/downloads" -Force | Out-Null
          if (Test-Path "public/downloads/AurumConect-Rhino7-1.0.0.zip") {
            Remove-Item "public/downloads/AurumConect-Rhino7-1.0.0.zip" -Force
          }
          Compress-Archive -Path "$bundle/*" -DestinationPath "public/downloads/AurumConect-Rhino7-1.0.0.zip" -CompressionLevel Optimal
          Write-Host "Complete installer package created with $($requiredFiles.Count) required files."

      - name: Upload verified installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AurumConect-Rhino7-1.0.0-Installer
          path: |
            public/downloads/AurumConect-Rhino7-1.0.0.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified installer files to website on main
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          git add public/downloads/AurumConect-Rhino7-1.0.0.zip

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "The published installer files are already up to date."
            exit 0
          }

          git commit -m "build(aurum-conect): publish complete Rhino 7 installer"
          if ($LASTEXITCODE -ne 0) { throw "Could not create the installer publication commit." }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the verified installer files to main." }
