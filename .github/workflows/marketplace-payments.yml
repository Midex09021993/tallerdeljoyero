name: Marketplace payments checks

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/marketplace-iniciar-pago/**"
      - "supabase/functions/marketplace-pago-webhook/**"
      - "supabase/config.toml"
      - ".github/workflows/marketplace-payments.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/marketplace-iniciar-pago/**"
      - "supabase/functions/marketplace-pago-webhook/**"
      - "supabase/config.toml"
      - ".github/workflows/marketplace-payments.yml"

permissions:
  contents: read

jobs:
  typecheck-payment-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check checkout creation function
        run: deno check supabase/functions/marketplace-iniciar-pago/index.ts
      - name: Type-check payment webhook function
        run: deno check supabase/functions/marketplace-pago-webhook/index.ts
